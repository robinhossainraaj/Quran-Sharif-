name: Build APK

# Runs when you push to the repo, or when you press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's build machines already include the Android SDK. Accept its licenses so
      # Gradle can download any extra platform the project needs.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # The permanent signing key (debug.keystore) is stored in the repo, so every build is
      # signed with the SAME key and the new APK installs over the old app.
      - name: Check signing key
        run: keytool -list -keystore debug.keystore -storepass android

      # If you added the private signing key as GitHub secrets, use it. Otherwise the build
      # falls back to the debug key.
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the private signing key"
          else
            echo "No private key secrets found - using the debug key"
          fi

      - name: Build the APK
        shell: bash
        run: |
          # Fast optimized build first; if it fails, fall back to the plain debug build.
          if gradle assembleFast --stacktrace > build.log 2>&1; then
            cp app/build/outputs/apk/fast/app-fast.apk QuranSharif.apk
          else
            grep -E "^e: |error:|What went wrong|Execution failed|Unresolved|Missing class" build.log | head -20 | while IFS= read -r line; do
              echo "::warning::Fast build failed: ${line:0:800}"
            done
            if gradle assembleDebug --stacktrace > build.log 2>&1; then
              cp app/build/outputs/apk/debug/app-debug.apk QuranSharif.apk
            else
              grep -E "^e: |error:|What went wrong|Execution failed|Unresolved|Type mismatch" build.log | head -40 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              exit 1
            fi
          fi
          ls -la QuranSharif.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranSharif-APK
          path: QuranSharif.apk
          if-no-files-found: error

      # Publish the APK on the repo's Releases page so it can be downloaded and installed
      # directly from a phone (no zip file to open).
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuranSharif.apk \
            --title "Al Quran - latest build" \
            --notes "APK built from the latest code. Download QuranSharif.apk and install it." \
            --target "${{ github.sha }}"
