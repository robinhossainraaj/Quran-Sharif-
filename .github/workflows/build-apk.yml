name: Build APK

# Runs when you push to the repo, or when you press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's build machines already include the Android SDK. Accept its licenses so
      # Gradle can download any extra platform the project needs.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # The permanent signing key (debug.keystore) is stored in the repo, so every build is
      # signed with the SAME key and the new APK installs over the old app.
      - name: Check signing key
        run: keytool -list -keystore debug.keystore -storepass android

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle assembleDebug --stacktrace 2>&1 | tee build.log; then
            # Show the real compile errors as annotations (easy to read without downloading logs)
            grep -E "^e: |error:|What went wrong|Execution failed|Unresolved|Type mismatch" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranSharif-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK on the repo's Releases page so it can be downloaded and installed
      # directly from a phone (no zip file to open).
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuranSharif.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuranSharif.apk \
            --title "Quran Sharif - latest build" \
            --notes "Debug APK built from the latest code. Download QuranSharif.apk and install it." \
            --target "${{ github.sha }}"
