name: Build APK

# Runs when you push to the repo, or when you press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's build machines already include the Android SDK. Accept its licenses so
      # Gradle can download any extra platform the project needs.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # The project expects a debug.keystore file, but GitHub doesn't store it, so create one.
      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranSharif-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK on the repo's Releases page so it can be downloaded and installed
      # directly from a phone (no zip file to open).
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuranSharif.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuranSharif.apk \
            --title "Quran Sharif - latest build" \
            --notes "Debug APK built from the latest code. Download QuranSharif.apk and install it." \
            --target "${{ github.sha }}"
